apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-check-api
  labels:
    app: health-check-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-check-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: health-check-api
    spec:
      containers:
        - name: health-check-api
          image: health-check-api:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: health-check-api-config
                  key: APP_ENV
            - name: PRACTICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: health-check-api-practice
                  key: PRACTICE_TOKEN